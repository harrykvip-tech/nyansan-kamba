name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install -D @capacitor/assets@3
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png assets/
          npx cap init "ဉာဏ်စမ်းကမ္ဘာ" com.nyansan.kamba --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#212848' --iconBackgroundColorDark '#212848'
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nyansan-kamba-apk
          path: android/app/build/outputs/apk/debug/app-de
